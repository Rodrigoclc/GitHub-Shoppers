name: Quality and publish immutable images

on:
  push:
    branches:
      - main
      - feat/immutable-deploy
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deployment-contract.json'
      - 'docs/deployment.md'
      - 'scripts/validate_deployment_contract.py'
      - '.github/workflows/immutable-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/rodrigoclc/github-shoppers-api
  WEB_IMAGE: ghcr.io/rodrigoclc/github-shoppers-web
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  quality:
    name: Backend migration/tests and frontend build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: github_shoppers
          POSTGRES_USER: github_shoppers_app
          POSTGRES_PASSWORD: github_shoppers_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U github_shoppers_app -d github_shoppers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: github_shoppers
      DB_USERNAME: github_shoppers_app
      DB_PASSWORD: github_shoppers_ci
      JWT_SECRET: github-shoppers-ci-only
      NODE_ENV: test
      PORT: 8082
      GITHUB_API_URL: https://api.github.com
      FRONTEND_URL: http://localhost:8083
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment contract
        run: python3 scripts/validate_deployment_contract.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand src/tests

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend with production API URL
        working-directory: frontend
        env:
          VITE_API_URL: https://api-github-shoppers.orodrigodev.com.br/api
        run: npm run build

      - name: Frontend lint (known baseline failures are non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

  publish:
    name: Publish linux/amd64 GHCR images
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: true
          sbom: true

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=https://api-github-shoppers.orodrigodev.com.br/api
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: true
          sbom: true

      - name: Write image digest artifact
        run: |
          set -euo pipefail
          mkdir -p image-digests
          cat > image-digests/manifest.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "tag": "${IMAGE_TAG}",
            "platform": "linux/amd64",
            "api": {"image": "${API_IMAGE}:${IMAGE_TAG}", "digest": "${{ steps.api.outputs.digest }}"},
            "web": {"image": "${WEB_IMAGE}:${IMAGE_TAG}", "digest": "${{ steps.web.outputs.digest }}"}
          }
          EOF
          test -s image-digests/manifest.json
          cat image-digests/manifest.json

      - name: Upload image digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests/manifest.json
          if-no-files-found: error
          retention-days: 90
