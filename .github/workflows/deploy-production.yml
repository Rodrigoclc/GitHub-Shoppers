name: Deploy GitHub Shoppers Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy GitHub Shoppers API to EC2
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
      APP_DIR: /home/ubuntu/github-shoppers
      ENV_FILE: /home/ubuntu/github-shoppers/.env
      APP_PORT: '8082'
      FRONTEND_PORT: '8083'
      API_URL: https://api.github-shoppers.orodrigodev.com.br
      FRONTEND_CONTAINER: github-shoppers-web
      FRONTEND_IMAGE: github-shoppers-web:prod
      CONTAINER_NAME: github-shoppers-api
      IMAGE_NAME: github-shoppers-api:prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_PORT EC2_SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Add SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

      - name: Trust EC2 host key
        run: ssh-keyscan -p "$EC2_SSH_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via Docker on EC2
        run: |
          set -euo pipefail
          ssh -p "$EC2_SSH_PORT" -i ~/.ssh/ec2_deploy_key "$EC2_USER@$EC2_HOST" \
            "set -e; \
             if [ ! -d '$APP_DIR/.git' ]; then \
               tmp_dir=\$(mktemp -d); \
               git clone https://github.com/Rodrigoclc/GitHub-Shoppers.git "\$tmp_dir"; \
               cp -a "\$tmp_dir"/. '$APP_DIR'/; \
               rm -rf "\$tmp_dir"; \
             else \
               git -C '$APP_DIR' fetch origin main; \
               git -C '$APP_DIR' reset --hard origin/main; \
             fi; \
             chmod +x '$APP_DIR/scripts/deploy_ec2_docker.sh'; \
             grep -q '^FRONTEND_URL=' '$ENV_FILE' || printf '%s\n' 'FRONTEND_URL=https://app.github-shoppers.orodrigodev.com.br' >> '$ENV_FILE'; \
             APP_DIR='$APP_DIR' ENV_FILE='$ENV_FILE' APP_PORT='$APP_PORT' FRONTEND_PORT='$FRONTEND_PORT' API_URL='$API_URL' CONTAINER_NAME='$CONTAINER_NAME' IMAGE_NAME='$IMAGE_NAME' FRONTEND_CONTAINER='$FRONTEND_CONTAINER' FRONTEND_IMAGE='$FRONTEND_IMAGE' '$APP_DIR/scripts/deploy_ec2_docker.sh'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_deploy_key
